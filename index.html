<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">QUIZ</p>
        <h1>My Quiz</h1>
        <p class="subtitle">自分で問題を追加できるシンプルなクイズサイト</p>
      </div>
      <button id="restartBtn" class="ghost">最初から</button>
    </header>

    <section class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">1 / 1</span>
        <span id="scoreText">正解 0</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
    </section>

    <section id="quizCard" class="card">
      <div class="question-number" id="questionNumber">Q1</div>
      <h2 id="question"></h2>
      <div id="choices" class="choices"></div>
      <div id="hintArea" class="hint-area">
        <button id="hintBtn" class="hint-btn">💡 ヒントを見る</button>
        <p id="hint" class="hint hidden"></p>
      </div>
      <div id="explanation" class="explanation hidden"></div>
      <button id="nextBtn" class="next hidden">次の問題 →</button>
    </section>

    <section id="resultCard" class="card result hidden">
      <p class="eyebrow">RESULT</p>
      <h2>クイズ終了！</h2>
      <div class="result-score"><span id="finalScore">0</span> / <span id="finalTotal">0</span></div>
      <p id="resultMessage"></p>
      <button id="retryBtn" class="next">もう一度挑戦</button>
    </section>
  </main>
  <script src="quiz.js"></script>
</body>
</html>
