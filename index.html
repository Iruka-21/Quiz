### 2. `index.html`
```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>JURASSIC RESEARCH SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tablet-frame">
    <!-- ヘッダー -->
    <header class="system-header">
        <div class="header-title-area">
            <h1>🦖 JURASSIC LAB</h1>
        </div>
        <div class="header-team-badge" id="teamBadge">TEAM: ---</div>
    </header>

    <!-- リアルタイム進捗ステータスバー -->
    <div class="status-banner" id="statusBar">
        <span id="systemStatusText">SYSTEM: ACTIVE</span>
        <span id="progressCount">0 / 5 CLEARED</span>
    </div>

    <!-- 区画切り替えタブ（クリアしないと先へ進めない） -->
    <nav class="progress-nav" id="sectorNav"></nav>

    <!-- メイン操作エリア -->
    <main class="main-content" id="mainArea"></main>

    <!-- フッター -->
    <footer class="system-footer">
        <span>JURASSIC OPERATING SYSTEM v4.2</span>
        <button class="btn-reset" onclick="confirmReset()">端末初期化 (次チームへ)</button>
    </footer>
</div>

<!-- クリア演出モーダル -->
<div class="modal-layer" id="modalLayer">
    <div class="modal-card" id="modalCard">
        <div class="modal-title" id="modalTitle">ACCESS GRANTED</div>
        <div class="modal-desc" id="modalDesc">調査データを承認しました。</div>
        <button class="btn-next-sector" id="modalBtn" onclick="nextFromModal()">次の区画へ進む</button>
    </div>
</div>

<script src="quiz.js"></script>
</body>
</html>
